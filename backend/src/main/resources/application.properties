spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finance}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:finance}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:finance_dev_only}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
finance.recurring.zone=${FINANCE_RECURRING_ZONE:Europe/Zagreb}
finance.recurring.cron=${FINANCE_RECURRING_CRON:0 0 2 * * *}
